name: CI/CD
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild_golang_api:
        description: Force Docker rebuild for golang-api
        required: false
        default: false
        type: boolean

env:
  GOLANGCI_LINT_VERSION: "v2.13.2"

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      golang-api-changed: ${{ steps.filter.outputs.golang-api-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            golang-api-changed:
              - 'services/golang-api/**'

  go-linters:
    name: Run linters
    needs: changes
    if: needs.changes.outputs.golang-api-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          cache: false
          go-version-file: services/golang-api/go.mod
          check-latest: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: services/golang-api

      - name: Check go mod tidy has no pending changes
        working-directory: services/golang-api
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  golang-api-build:
    name: Build golang-api
    needs:
      - changes
      - go-linters
    if: needs.changes.outputs.golang-api-changed == 'true' || inputs.force_rebuild_golang_api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/golang-api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ./services/golang-api/Dockerfile
          context: ./services/golang-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
