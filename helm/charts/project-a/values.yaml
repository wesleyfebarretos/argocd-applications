golang-api:
  enabled: true
  fullnameOverride: golang-api
  env:
    - name: DB_URI
      valueFrom:
        secretKeyRef:
          name: project-a-db-app
          key: uri

cnpg:
  cluster:
    instances: 1
    major: 18
    postgresql:
      parameters:
        shared_buffers: "8MB"
    storage:
      size: 1Gi
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
