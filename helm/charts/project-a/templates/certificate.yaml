{{- if .Values.certificate.enabled -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: project-a-tls
spec:
  secretName: project-a-tls
  issuerRef:
    kind: ClusterIssuer
    name: platform-selfsigned
  dnsNames:
    - {{ required "certificate.domain is required when certificate is enabled" .Values.certificate.domain }}
    {{- range .Values.certificate.additionalHosts -}}
    - {{ . }}
    {{- end -}}
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-project-a-gateway-tls
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: project-a-tls
{{- end -}}
